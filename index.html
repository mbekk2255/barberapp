<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Toshkent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root { --bg:#fff; --card:#f3f4f6; --text:#111; --hint:#6b7280; --btn:#2563eb; --btntext:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1f2937; --text:#f3f4f6; --hint:#9ca3af; } }
  body { margin:0; padding:12px; font-family:system-ui,sans-serif; background:var(--tg-theme-bg-color,var(--bg)); color:var(--tg-theme-text-color,var(--text)); }
  h1 { font-size:20px; margin:4px 0 12px; }
  select, input { width:100%; padding:10px; border-radius:10px; border:0; margin-bottom:8px; font-size:15px; background:var(--tg-theme-secondary-bg-color,var(--card)); color:inherit; box-sizing:border-box; }
  .card { background:var(--tg-theme-secondary-bg-color,var(--card)); border-radius:14px; padding:12px; margin-bottom:10px; }
  .name { font-weight:600; font-size:16px; }
  #map { height:260px; border-radius:14px; margin-bottom:10px; z-index:0; }
  .note { font-size:13px; margin:6px 0 2px; white-space:pre-line; }
  .meta { color:var(--tg-theme-hint-color,var(--hint)); font-size:13px; margin:2px 0; }
  .row { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  .open { color:#16a34a; font-weight:600; } .closed { color:#dc2626; font-weight:600; }
  a.btn { display:inline-block; margin-top:8px; margin-right:6px; padding:8px 12px; border-radius:10px; background:var(--tg-theme-button-color,var(--btn)); color:var(--tg-theme-button-text-color,var(--btntext)); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<h1>✂️ Toshkent sartaroshxonalari</h1>
<div id="map"></div>
<input id="q" placeholder="Qidirish (nomi yoki manzil)">
<select id="district"><option value="">Barcha tumanlar</option></select>
<select id="sort">
  <option value="name">Nomi bo'yicha</option>
  <option value="price">Arzonidan qimmatiga</option>
</select>
<div id="list"><p>Yuklanmoqda...</p></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();

// 1) Google Sheets "Veb-sahifada e'lon qilish" (CSV) havolasini shu yerga qo'ying.
//    Bo'sh qoldirsangiz, pastdagi namunaviy ma'lumotlar ko'rinadi.
const SHEET_CSV_URL = "";

const SAMPLE = [
  { name:"Namuna Barber 1", district:"Chilonzor", address:"Bunyodkor ko'chasi, 10", map:"https://www.google.com/maps?q=41.2756,69.2037", open:"09:00", close:"21:00", phone:"+998900000001", note:"Narx soch turiga qarab o'zgaradi. Oldindan yozilish shart emas.", prices:{ "Soch olish":50000, "Soqol":30000, "Soch + soqol":70000 } },
  { name:"Namuna Barber 2", district:"Yunusobod", address:"Amir Temur shoh ko'chasi, 25", map:"https://www.google.com/maps?q=41.3640,69.2870", open:"10:00", close:"22:00", phone:"+998900000002", prices:{ "Soch olish":80000, "Soqol":40000, "Soch + soqol":110000 } },
];

// Form savollari sarlavhasi (Google Sheets ustun nomi) bilan bir xil bo'lishi kerak
const COL = {
  name:"Sartaroshxona nomi", district:"Tuman", address:"Manzil", map:"Google Maps havolasi",
  open:"Ochilish vaqti", close:"Yopilish vaqti", hair:"Soch olish narxi", beard:"Soqol narxi",
  both:"Soch + soqol narxi", phone:"Telefon raqami", note:"Izoh", coord:"Koordinata", ok:"Tasdiqlandi"
};

let DATA = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const num = v => parseInt(String(v ?? "").replace(/\D/g, ""), 10) || 0;
const fmt = n => n.toLocaleString("ru-RU") + " so'mdan";
const toMin = t => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); return m ? +m[1]*60 + +m[2] : null; };
const safeUrl = u => /^https:\/\//i.test(u) ? u : "";
const safePhone = p => String(p ?? "").replace(/[^\d+]/g, "");
const minPrice = b => { const v = Object.values(b.prices).filter(x => x > 0); return v.length ? Math.min(...v) : Infinity; };

function isOpen(b) {
  const o = toMin(b.open), c = toMin(b.close); if (o === null || c === null) return null;
  const d = new Date(), n = d.getHours()*60 + d.getMinutes();
  return o <= c ? (n >= o && n < c) : (n >= o || n < c);
}

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function load() {
  if (!SHEET_CSV_URL) return SAMPLE;
  const res = await fetch(SHEET_CSV_URL);
  const rows = parseCSV(await res.text());
  const head = rows[0].map(h => h.trim());
  const idx = k => head.indexOf(COL[k]);
  return rows.slice(1)
    .filter(r => (r[idx("ok")] || "").trim().toLowerCase() === "ha")
    .map(r => ({
      name: r[idx("name")], district: (r[idx("district")] || "").trim(), address: r[idx("address")],
      map: r[idx("map")], coord: r[idx("coord")], note: r[idx("note")], open: r[idx("open")], close: r[idx("close")], phone: r[idx("phone")],
      prices: { "Soch olish": num(r[idx("hair")]), "Soqol": num(r[idx("beard")]), "Soch + soqol": num(r[idx("both")]) }
    }))
    .filter(b => b.name);
}

// Koordinata: "41.3111, 69.2797" yoki Google/Yandex havolasidan olinadi
function getCoord(coord, url) {
  const tries = [
    [coord, /(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/],
    [url, /@(-?\d+\.\d+),(-?\d+\.\d+)/],
    [url, /[?&](?:q|ll|query|center)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/],
    [url, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/],
  ];
  for (const [src, re] of tries) {
    const m = String(src ?? "").match(re); if (!m) continue;
    let a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (Math.abs(a) > 60 && Math.abs(b) <= 60) [a, b] = [b, a]; // Yandex: uzunlik, kenglik
    if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return [a, b];
  }
  return null;
}

let map = null, layer = null;
const TASHKENT = [41.3111, 69.2797];
if (typeof L !== "undefined") {
  map = L.map("map", { zoomControl: true }).setView(TASHKENT, 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
  layer = L.layerGroup().addTo(map);
} else { $("map").style.display = "none"; }

const markers = {};
function updateMap(items) {
  if (!map) return;
  layer.clearLayers();
  const pts = [];
  items.filter(b => b.pos).forEach(b => {
    const m = L.circleMarker(b.pos, { radius: 9, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 0.95 }).addTo(layer);
    const mp = minPrice(b);
    m.bindPopup("<b>" + esc(b.name) + "</b>" + (mp !== Infinity ? "<br>" + fmt(mp) : ""));
    markers[b.id] = m; pts.push(b.pos);
  });
  if (pts.length === 1) map.setView(pts[0], 15);
  else if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  else map.setView(TASHKENT, 11);
}
function focusOn(id) {
  const m = markers[id]; if (!m || !map) return;
  window.scrollTo({ top: 0, behavior: "smooth" });
  map.setView(m.getLatLng(), 16); m.openPopup();
}

function render() {
  const q = $("q").value.toLowerCase(), dist = $("district").value;
  const items = DATA.filter(b => (!dist || b.district === dist) && (b.name + " " + b.address).toLowerCase().includes(q));
  items.sort($("sort").value === "price" ? (a,b) => minPrice(a) - minPrice(b) : (a,b) => a.name.localeCompare(b.name));
  $("list").innerHTML = items.map(b => {
    const st = isOpen(b), map = safeUrl(b.map), ph = safePhone(b.phone);
    return `<div class="card">
      <div class="name">${esc(b.name)}</div>
      <div class="meta">📍 ${esc(b.district)}, ${esc(b.address)}</div>
      <div class="meta">🕒 ${esc(b.open)}–${esc(b.close)}${st === null ? "" : ` · <span class="${st ? "open" : "closed"}">${st ? "Hozir ochiq" : "Yopiq"}</span>`}</div>
      ${Object.entries(b.prices).filter(([k,v]) => v > 0).map(([k,v]) => `<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("")}
      ${b.note && b.note.trim() ? `<div class="note">💬 ${esc(b.note.trim())}</div>` : ""}
      ${b.pos ? `<a class="btn" href="#" onclick="focusOn(${b.id});return false">📍 Xaritada ko'rish</a>` : ""}
      ${map ? `<a class="btn" href="${esc(map)}" target="_blank">🧭 Yo'nalish</a>` : ""}
      ${ph ? `<a class="btn" href="tel:${esc(ph)}">📞 Qo'ng'iroq</a>` : ""}
    </div>`;
  }).join("") || "<p>Hech narsa topilmadi</p>";
  updateMap(items);
}

load().then(d => {
  DATA = d.map((b, i) => ({ ...b, id: i, pos: getCoord(b.coord, b.map) }));
  [...new Set(DATA.map(b => b.district).filter(Boolean))].forEach(x => $("district").add(new Option(x, x)));
  ["q","district","sort"].forEach(id => $(id).addEventListener("input", render));
  render();
}).catch(() => { $("list").innerHTML = "<p>Ma'lumotni yuklab bo'lmadi. Keyinroq urinib ko'ring.</p>"; });
</script>
</body>
</html>
